version: 2

metrics:
  # ==========================================
  # THEME 1: ROUTE OPTIMIZATION & GROWTH KPIs
  # ==========================================
  - name: passenger_load_factor_pct
    description: "Percentage of total manufactured seat capacity successfully occupied by flying passengers."
    type: ratio
    type_params:
      numerator: metric('flight_passenger_count_sum')
      denominator: metric('flight_seat_capacity_sum')

  - name: gross_combined_revenue_usd
    description: "Total combined operational cash inflowing from core ticket prices and ancillary add-ons."
    type: derived
    type_params:
      expr: ticket_revenue + ancillary_revenue
      metrics:
        - name: ticket_revenue
        - name: ancillary_revenue

  - name: route_contribution_margin_usd
    description: "The absolute profit margin of a network asset after dropping actual fleet operational costs."
    type: derived
    type_params:
      expr: gross_combined_revenue_usd - total_operating_cost_sum
      metrics:
        - name: gross_combined_revenue_usd
        - name: total_operating_cost_sum

  # ==========================================
  # THEME 2: CUSTOMER RETENTION KPIs
  # ==========================================
  - name: network_delay_rate_pct
    description: "Proportion of scheduled operations experiencing systemic ground or airborne delays."
    type: ratio
    type_params:
      numerator: metric('delayed_flights_operated')
      denominator: metric('total_flights_operated')

  # ==========================================
  # THEME 3: UP-SELL / CROSS-SELL KPIs
  # ==========================================
  - name: ancillary_yield_per_passenger_usd
    description: "Average high-margin unbundled revenue extracted per ticket item."
    type: ratio
    type_params:
      numerator: metric('ancillary_revenue')
      denominator: metric('total_bookings_count')

  - name: digital_channel_adoption_rate_pct
    description: "Proportion of volume handled via low-fee direct methods (Web/App) minimizing GDS overhead."
    type: ratio
    type_params:
      numerator: metric('digital_bookings_count')
      denominator: metric('total_bookings_count')