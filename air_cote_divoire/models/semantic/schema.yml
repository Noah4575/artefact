version: 2

models:
  # ==========================================
  # 1. NETWORK PROFITABILITY MART
  # ==========================================
  - name: mart_network_profitability
    description: >
      One row per flight operated. Combines flight performance, route metadata,
      and booking revenue to expose profitability, load factor, yield and delay KPIs.
      Primary mart for the Network & Profitability dashboard section.
    columns:
      - name: flight_id
        description: "Unique identifier for the flight leg."
        tests:
          - not_null
      - name: flight_date
        description: "Date the flight was operated."
        tests:
          - not_null
      - name: route_label
        description: "Human-readable route label (e.g. ABJ → DKR)."
      - name: route_type
        description: "Classification of the route (e.g. Regional, International, Domestic)."
      - name: seat_capacity
        description: "Total seats available on the aircraft."
      - name: passenger_count
        description: "Total revenue passengers boarded."
      - name: load_factor_pct
        description: "Passenger count as a % of seat capacity. Core network efficiency KPI."
      - name: gross_revenue_usd
        description: "Sum of ticket + ancillary revenue for the flight."
      - name: total_operating_cost_usd
        description: "Total fuel + crew + maintenance cost for the flight."
      - name: contribution_margin_usd
        description: "Gross revenue minus total operating cost. Core profitability KPI."
      - name: yield_per_passenger_usd
        description: "Average revenue generated per passenger boarded."
      - name: delay_min
        description: "Total delay in minutes recorded on departure."
      - name: is_delayed
        description: "Binary flag: 1 if flight status is Delayed."
      - name: is_cancelled
        description: "Binary flag: 1 if flight status is Cancelled."

  # ==========================================
  # 2. CUSTOMER RETENTION MART
  # ==========================================
  - name: mart_customer_retention
    description: >
      One row per customer. Aggregates lifetime booking behavior, operational
      experience (delays), and sentiment to compute a churn risk level.
      Primary mart for the Customer & Retention dashboard section.
    columns:
      - name: customer_id
        description: "Business identifier for the customer."
        tests:
          - not_null
          - unique
      - name: customer_segment
        description: "Customer segment classification (e.g. Business, Leisure)."
      - name: loyalty_tier
        description: "Loyalty program tier (e.g. Silver, Gold, Platinum)."
      - name: sentiment_score
        description: "Lifetime sentiment score derived from customer reviews."
      - name: sentiment_category
        description: "Bucketed sentiment label: Delighted, Neutral, or At-Risk."
      - name: total_bookings_lifetime
        description: "Total number of bookings made by this customer."
      - name: lifetime_revenue_usd
        description: "Total revenue (ticket + ancillary) generated by this customer."
      - name: is_repeat_customer
        description: "1 if the customer has made more than one booking."
      - name: avg_revenue_per_booking_usd
        description: "Average revenue per booking for this customer."
      - name: personal_delay_rate_pct
        description: "% of this customer's flights that were delayed."
      - name: churn_risk_level
        description: >
          Composite churn risk score: Critical, High, Medium, Low, Safe.
          Combines sentiment, delay exposure, and loyalty tier.

  # ==========================================
  # 3. UPSELL / CROSS-SELL MART
  # ==========================================
  - name: mart_upsell_crosssell
    description: >
      Aggregated by customer segment, loyalty tier, fare class, fare family,
      and booking channel. Exposes ancillary attach rates, digital adoption,
      and yield per booking for upsell and cross-sell analysis.
    columns:
      - name: customer_segment
        description: "Customer segment dimension."
      - name: loyalty_tier
        description: "Loyalty program tier dimension."
      - name: fare_class
        description: "Fare class (e.g. Y, J, F)."
      - name: fare_family
        description: "Commercial fare family (e.g. Basic, Flex, Business)."
      - name: booking_channel
        description: "Channel used to make the booking."
      - name: channel_type
        description: "Simplified channel: Digital (Web/App) or Indirect (GDS/agency)."
      - name: total_bookings
        description: "Total number of bookings in this segment/channel combination."
      - name: ancillary_attach_rate_pct
        description: "% of bookings with at least one ancillary item purchased."
      - name: bag_attach_rate_pct
        description: "% of bookings with at least one bag checked."
      - name: ancillary_yield_per_booking_usd
        description: "Average ancillary revenue per booking."
      - name: total_revenue_per_booking_usd
        description: "Average total revenue (ticket + ancillary) per booking."
      - name: digital_adoption_rate_pct
        description: "% of bookings made via Web or Mobile App."
      - name: avg_sentiment_score
        description: "Average customer sentiment score for this segment combination."

  # ==========================================
  # 4. DECISION LAYER MART
  # ==========================================
  - name: mart_decision_layer
    description: >
      One row per route. Aggregates all financial, operational, and customer
      signals to produce a strategic_decision label for each route.
      Primary mart for the executive Decision Layer dashboard section.
    columns:
      - name: route_id
        description: "Unique business identifier for the route."
        tests:
          - not_null
          - unique
      - name: route_label
        description: "Human-readable route label (e.g. ABJ → DKR)."
      - name: route_type
        description: "Route classification."
      - name: avg_load_factor_pct
        description: "Average passenger load factor across all operated flights."
      - name: total_gross_revenue_usd
        description: "Total ticket + ancillary revenue generated on the route."
      - name: total_operating_cost_usd
        description: "Total operating cost across all flights on the route."
      - name: total_margin_usd
        description: "Total contribution margin (revenue - cost) for the route."
      - name: delay_rate_pct
        description: "% of flights on this route that were delayed."
      - name: cancellation_rate_pct
        description: "% of flights on this route that were cancelled."
      - name: avg_sentiment_score
        description: "Average sentiment score of passengers who flew this route."
      - name: at_risk_customers
        description: "Count of At-Risk sentiment customers on this route."
      - name: premium_customers
        description: "Count of Gold/Platinum loyalty customers on this route."
      - name: digital_adoption_rate_pct
        description: "% of bookings on this route made via digital channels."
      - name: strategic_decision
        description: >
          Executive decision label: 
          GROW (high demand, profitable, reliable),
          DEFEND (profitable but operationally at risk),
          REVIEW (unprofitable),
          MONITOR (watch and optimize).